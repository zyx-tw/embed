name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.2
      - run: ruff check embed tests scripts
      - run: python -m unittest discover -s tests -t .

  image:
    uses: zyx1121/.github/.github/workflows/image.yml@main
    permissions:
      contents: read
      packages: write
    with:
      images: '[{"name": "ghcr.io/zyx-tw/embed", "file": "deploy/release.Dockerfile"}]'
      smoke: bash deploy/smoke.sh

  promote:
    needs: [check, image]
    uses: zyx1121/.github/.github/workflows/promote.yml@main
    permissions:
      contents: read
      packages: write
    with:
      images: '["ghcr.io/zyx-tw/embed"]'
