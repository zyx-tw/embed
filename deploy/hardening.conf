# /etc/systemd/system/carrel-app-embed.service.d/hardening.conf: the same
# limits the old embed.service had. The render group opens
# /dev/dri/renderD128 for the GPU; the app writes only its models folder.
[Service]
SupplementaryGroups=render
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
ReadWritePaths=/var/lib/embed
